name: Tech Jobs Bot -- CareerMirror Email Draft

on:
  schedule:
    # Tuesday, Thursday and Saturday, about 6:43am Central (12:43 UTC).
    # Each day has its own theme (see THEMES in src/tech_jobs.py).
    - cron: "43 12 * * 2,4,6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List jobs in the run summary without emailing"
        type: boolean
        default: true
      theme_day:
        description: "Theme to use: 1 data, 3 AI and research, 5 product and engineering (blank = today)"
        type: string
        default: ""
  # On a pull request that changes this bot, do a dry run only: it checks every
  # company feed and lists the jobs, and never emails or calls the AI.
  pull_request:
    paths:
      - "src/tech_jobs.py"
      - "tech_main.py"
      - "tests/test_tech_jobs.py"
      - ".github/workflows/tech_jobs.yml"

jobs:
  tech-jobs:
    name: Collect, Draft, and Email
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Dry run (pull request)
        if: github.event_name == 'pull_request'
        env:
          DRY_RUN: "true"
          THEME_DAY: "1"
        run: python tech_main.py

      - name: Run Tech Jobs Bot
        if: github.event_name != 'pull_request'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          THEME_DAY: ${{ inputs.theme_day || '' }}
        run: python tech_main.py

  # Prevents GitHub from auto-disabling this scheduled workflow after
  # 60 days without repo activity. Uses the API (no commits).
  keepalive:
    name: Keepalive
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/tech_jobs.yml/enable"
